name: Deploy gulevapsy site to GitHub Pages

on:
  # Запускаем скрипт при каждом пуше в ветку main
  push:
    branches: ["main"]

  # Позволяет запускать этот workflow вручную из вкладки Actions
  workflow_dispatch:

# Устанавливаем права для токена (необходимо для деплоя на Pages)
permissions:
  contents: read
  pages: write
  id-token: write

# Отменяем текущий деплой, если во время него запустился новый
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Работа по сборке (Build)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Используем стабильную версию Node.js
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build # Команда сборки Vite

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Папка, куда Vite сохраняет готовый билд

  # Работа по деплою (Deploy)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
